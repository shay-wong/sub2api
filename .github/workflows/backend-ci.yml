name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        if: matrix.suite == 'unit'
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        id: go-version
        run: |
          go version | grep -q 'go1.27.4'
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore shared Go modules
        id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: release-go-modules-${{ runner.os }}-${{ steps.go-version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
      - name: Cache test Go build output
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ matrix.suite }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ matrix.suite }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ matrix.suite }}-
      - name: Run ${{ matrix.suite }} tests
        working-directory: backend
        run: make test-${{ matrix.suite }}
      - name: Save shared Go modules
        if: ${{ matrix.suite == 'unit' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        id: go-version
        run: |
          go version | grep -q 'go1.27.4'
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore shared Go modules
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: release-go-modules-${{ runner.os }}-${{ steps.go-version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
      - name: Cache lint Go build output
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-lint-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-lint-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            ci-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-lint-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
