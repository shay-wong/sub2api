name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      ignore_repository_simple_release:
        description: 'Ignore repository SIMPLE_RELEASE variable for reusable callers'
        required: false
        type: boolean
        default: false
      sync_version_branch:
        description: 'Branch to sync VERSION after a successful release'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      sync_version_branch:
        description: 'Branch to sync VERSION after a successful release'
        required: false
        type: string
        default: ''

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ inputs.simple_release == true || github.event.inputs.simple_release == 'true' || (inputs.ignore_repository_simple_release != true && vars.SIMPLE_RELEASE == 'true') }}

permissions:
  contents: write
  packages: write

jobs:
  # Update VERSION file with tag version
  update-version:
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-fork.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Update VERSION file
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION=${RELEASE_TAG#refs/tags/}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          VERSION=${VERSION#v}
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-fork.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-fork.') }}
    needs: [update-version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve DockerHub image
        id: dockerhub
        env:
          DOCKERHUB_NAME: ${{ vars.DOCKERHUB_NAME || secrets.DOCKERHUB_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SIMPLE_RELEASE: ${{ env.SIMPLE_RELEASE }}
        run: |
          set -euo pipefail

          if [ "$SIMPLE_RELEASE" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image="${DOCKERHUB_NAME:-$DOCKERHUB_USERNAME}"
          image="${image#docker.io/}"
          image="${image%/}"

          if [ -z "$image" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DockerHub publishing is configured but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing" >&2
            exit 1
          fi

          if [[ "$image" == *:* ]] || [[ "$image" =~ [[:space:]] ]]; then
            echo "DOCKERHUB_NAME must be a Docker Hub namespace or repository path without tag" >&2
            exit 1
          fi

          if [[ "$image" != */* ]]; then
            image="${image}/sub2api"
          fi

          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG_NAME=${RELEASE_TAG#refs/tags/}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          {
            echo "message<<EOF"
            echo "$TAG_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_INSTALL_BRANCH: ${{ contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-fork.') && 'stable' || github.event.repository.default_branch }}
          DOCKERHUB_IMAGE: ${{ steps.dockerhub.outputs.image }}
          PUBLISH_ROLLING_TAGS: "true"

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && steps.dockerhub.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub.outputs.image }}
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_IMAGE: ${{ steps.dockerhub.outputs.image }}
          RAW_TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          if [ -n "$RELEASE_TAG" ]; then
            TAG_NAME=${RELEASE_TAG#refs/tags/}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$RAW_TAG_MESSAGE"
          TAG_MESSAGE="${TAG_MESSAGE//_/\\_}"
          TAG_MESSAGE="${TAG_MESSAGE//\*/\\*}"
          TAG_MESSAGE="${TAG_MESSAGE//\`/\\\`}"
          TAG_MESSAGE="${TAG_MESSAGE//\[/\\[}"

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ "$DOCKERHUB_IMAGE" != "skip" ]; then
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKERHUB_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ "$DOCKERHUB_IMAGE" != "skip" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKERHUB_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VERSION sync branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sync_version_branch || github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
          REQUESTED_SYNC_VERSION_BRANCH: ${{ inputs.sync_version_branch }}
          SYNC_VERSION_BRANCH: ${{ inputs.sync_version_branch || github.event.repository.default_branch }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION=${RELEASE_TAG#refs/tags/}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          VERSION=${VERSION#v}

          if [[ "$VERSION" == *-fork.* && -z "$REQUESTED_SYNC_VERSION_BRANCH" ]]; then
            echo "Fork release version $VERSION has no explicit sync_version_branch; skipping VERSION sync"
            exit 0
          fi

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -F - <<EOF
          sync VERSION to $VERSION [skip ci]

          Constraint: release workflows embed tag versions before building
          Directive: sync VERSION to the branch that owns the release lane
          Confidence: high
          Scope-risk: narrow
          Tested: release job completed before sync
          Not-tested: local workflow cannot push to GitHub
          EOF
          git push origin HEAD:"$SYNC_VERSION_BRANCH"
