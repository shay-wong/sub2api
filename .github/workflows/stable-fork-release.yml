name: Publish stable fork release

on:
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: stable-fork-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api

jobs:
  create-fork-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve next fork release tag
        id: version
        run: |
          set -euo pipefail

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          local_version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          if [[ ! "$local_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-fork\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid VERSION: ${local_version}" >&2
            exit 1
          fi

          local_base="${BASH_REMATCH[1]}"
          git fetch --no-tags "$upstream_url" main
          if ! merged_upstream_commit=$(git merge-base HEAD FETCH_HEAD); then
            echo "Unable to resolve the merged upstream baseline." >&2
            exit 1
          fi
          if ! merged_upstream_version=$(git show "${merged_upstream_commit}:backend/cmd/server/VERSION" | tr -d '\r\n'); then
            echo "Unable to read VERSION from merged upstream commit ${merged_upstream_commit}." >&2
            exit 1
          fi
          if [[ ! "$merged_upstream_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid merged upstream VERSION: ${merged_upstream_version}" >&2
            exit 1
          fi
          if [[ "$local_base" != "$merged_upstream_version" ]]; then
            echo "VERSION base v${local_base} does not match merged upstream base v${merged_upstream_version} (${merged_upstream_commit})." >&2
            echo "Update backend/cmd/server/VERSION before releasing." >&2
            exit 1
          fi

          upstream_tag="v${local_base}"
          if ! git ls-remote --exit-code --tags --refs "$upstream_url" "refs/tags/${upstream_tag}" >/dev/null; then
            echo "VERSION base ${upstream_tag} is not a stable tag in ${UPSTREAM_REPOSITORY}." >&2
            exit 1
          fi

          existing_fork_tags=$(git ls-remote --tags --refs origin "refs/tags/${upstream_tag}-fork.*" \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' || true)

          latest_fork=0
          fork_prefix="${upstream_tag}-fork."
          while IFS= read -r fork_tag; do
            [[ -n "$fork_tag" ]] || continue
            fork_number="${fork_tag#"$fork_prefix"}"
            if [[ "$fork_number" =~ ^[0-9]+$ ]] && (( fork_number > latest_fork )); then
              latest_fork="$fork_number"
            fi
          done <<< "$existing_fork_tags"

          release_name="${upstream_tag}-fork.$((latest_fork + 1))"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_name}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${release_name}" >&2
            exit 1
          fi

          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "Next fork release tag: ${release_name}"

      - name: Push fork release tag
        env:
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_NAME" "$GITHUB_SHA" -m "Release ${RELEASE_NAME}"
          git push origin "refs/tags/${RELEASE_NAME}"

  release:
    needs: create-fork-tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.create-fork-tag.outputs.release_name }}
      simple_release: false
      ignore_repository_simple_release: true
      sync_version_branch: stable
    permissions:
      contents: write
      packages: write
    secrets: inherit
